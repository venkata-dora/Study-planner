name: Quality and container checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: learning
          POSTGRES_USER: learning
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U learning" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
    env:
      DJANGO_DEBUG: 'true'
      DJANGO_SECRET_KEY: ci-only-key-not-used-in-any-deployed-environment-123456789
      DATABASE_URL: postgresql://learning:ci-only-password@localhost:5432/learning
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.lock
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py migrate --noinput
      - run: python backend/manage.py test curriculum
      - run: DJANGO_DEBUG=false python backend/manage.py check --deploy --fail-level WARNING
      - run: pip check
      - run: pip install pip-audit && pip-audit -r backend/requirements.lock
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: node tests/run.mjs
      - run: VITE_DJANGO_API=true npm run build
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp deploy/.env.example deploy/.env
      - run: docker compose --env-file deploy/.env config --quiet
      - run: docker compose --env-file deploy/.env build
      - run: docker compose --env-file deploy/.env up -d --wait api web worker
      - run: curl --fail http://localhost:8080/health/ready
      - run: curl --fail http://localhost:8080/api/v1/session
      - if: always()
        run: docker compose --env-file deploy/.env down -v
