name: Publish verified images
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r backend/requirements.lock
      - run: DJANGO_DEBUG=true DJANGO_SECRET_KEY=release-checks python backend/manage.py test curriculum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm audit --audit-level=moderate && node tests/run.mjs
      - run: pip install pip-audit && pip-audit -r backend/requirements.lock
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names
        id: names
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "base=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.names.outputs.base }}-api:${{ github.sha }}
          provenance: true
          sbom: true
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.web
          push: true
          tags: ${{ steps.names.outputs.base }}-web:${{ github.sha }}
          provenance: true
          sbom: true
